<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Sheglam - Cosméticos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold">Catálogo Sheglam</h1>
            <p class="text-muted">Explora nuestros productos de cosmética y filtra según tus preferencias</p>
        </header>

        <!-- Sección de Filtros Interactivos -->
        <div class="card shadow-sm mb-4 p-4 bg-white rounded-4">
            <div class="row g-3">
                <!-- Filtro 1: Marca -->
                <div class="col-md-4">
                    <label for="filtroMarca" class="form-label fw-semibold">Filtrar por Marca</label>
                    <select id="filtroMarca" class="form-select">
                        <option value="">Todas las marcas</option>
                    </select>
                </div>
                <!-- Filtro 2: Categoría -->
                <div class="col-md-4">
                    <label for="filtroCategoria" class="form-label fw-semibold">Filtrar por Categoría</label>
                    <select id="filtroCategoria" class="form-select">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
                <!-- Filtro 3: Precio Máximo -->
                <div class="col-md-4">
                    <label for="filtroPrecio" class="form-label fw-semibold">Precio Máximo: $<span id="valorPrecio">20</span></label>
                    <input type="range" class="form-range" id="filtroPrecio" min="0" max="20" step="1" value="20">
                </div>
            </div>
        </div>

        <!-- Contenedor de Productos -->
        <div id="contenedorProductos" class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Las tarjetas de productos se cargarán dinámicamente con JavaScript -->
        </div>
    </div>

    <!-- Archivo JavaScript principal -->
    <script src="app.js"></script>
</body>
</html>
